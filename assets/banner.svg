<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skySynth" x1="0" y1="0" x2="0" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060813"/>
      <stop offset="55%" stop-color="#120c2b"/>
      <stop offset="100%" stop-color="#24103a"/>
    </linearGradient>
    <linearGradient id="groundSynth" x1="0" y1="165" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140c2e"/>
      <stop offset="100%" stop-color="#060916"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="40" y1="40" x2="540" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d8d"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="710" y1="70" x2="710" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="52%" stop-color="#fb5607"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="gridCyanTurquoise" x1="0" y1="165" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d8d"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <filter id="gridGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect width="900" height="1.5" fill="#000000" opacity="0.28"/>
    </pattern>
    <clipPath id="sunClip">
      <circle cx="710" cy="165" r="90"/>
    </clipPath>
    <clipPath id="bannerClip">
      <rect x="2" y="2" width="896" height="236" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Ciel et sol -->
    <rect x="0" y="0" width="900" height="165" fill="url(#skySynth)"/>
    <rect x="0" y="165" width="900" height="75" fill="url(#groundSynth)"/>

    <!-- Soleil synthwave rayé à droite (#ffbe0b -> #fb5607 -> #ff006e) -->
    <g clip-path="url(#sunClip)">
      <rect x="615" y="70" width="190" height="96" fill="url(#sunGrad)"/>
      <rect x="615" y="108" width="190" height="2.5" fill="#120824"/>
      <rect x="615" y="116" width="190" height="3.5" fill="#120824"/>
      <rect x="615" y="125" width="190" height="4.5" fill="#120824"/>
      <rect x="615" y="135" width="190" height="5.5" fill="#120824"/>
      <rect x="615" y="146" width="190" height="7" fill="#120824"/>
      <rect x="615" y="158" width="190" height="8" fill="#120824"/>
    </g>

    <!-- Ligne d'horizon -->
    <line x1="0" y1="165" x2="900" y2="165" stroke="#00f5d4" stroke-width="1.5" opacity="0.85" filter="url(#gridGlow)"/>

    <!-- Grille en perspective (#00f5d4 / #00bbf9) avec lueur discrète -->
    <g stroke="url(#gridCyanTurquoise)" stroke-width="1.1" opacity="0.62" filter="url(#gridGlow)">
      <line x1="0" y1="173" x2="900" y2="173"/>
      <line x1="0" y1="184" x2="900" y2="184"/>
      <line x1="0" y1="199" x2="900" y2="199"/>
      <line x1="0" y1="218" x2="900" y2="218"/>
      <!-- Rayons convergents -->
      <line x1="450" y1="165" x2="450" y2="240"/>
      <line x1="450" y1="165" x2="310" y2="240"/>
      <line x1="450" y1="165" x2="150" y2="240"/>
      <line x1="450" y1="165" x2="-40" y2="240"/>
      <line x1="450" y1="165" x2="590" y2="240"/>
      <line x1="450" y1="165" x2="750" y2="240"/>
      <line x1="450" y1="165" x2="940" y2="240"/>
    </g>

    <!-- Scanlines rétro subtiles -->
    <rect x="0" y="0" width="900" height="240" fill="url(#scanlines)"/>

    <!-- Titre principal -->
    <text x="42" y="86" font-family="'Segoe UI', 'Arial Black', Ubuntu, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="url(#titleGrad)">LÉO BASKARANE</text>

    <!-- Sous-titres style rétro -->
    <text x="42" y="118" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#00f5d4">DÉVELOPPEUR FULL-STACK &amp; CRÉATEUR WEB</text>
    <text x="42" y="141" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#00bbf9">PYTHON  •  FASTAPI  •  HTML/CSS/JS  •  MYSQL</text>

    <!-- Petit badge encadré en bas à gauche -->
    <rect x="42" y="182" width="290" height="32" rx="3" fill="#080716" fill-opacity="0.9" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="187" y="203" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#f8fafc">FULL-STACK • PYTHON &amp; FASTAPI</text>
  </g>

  <!-- Bordure extérieure dégradée -->
  <rect x="2" y="2" width="896" height="236" rx="6" stroke="url(#borderGrad)" stroke-width="2.5"/>
</svg>
