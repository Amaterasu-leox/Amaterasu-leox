<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGeo" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a12"/>
      <stop offset="50%" stop-color="#111324"/>
      <stop offset="100%" stop-color="#0b1622"/>
    </linearGradient>
    <linearGradient id="accentGeo" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGeo" x1="45" y1="50" x2="460" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="900" height="220" rx="12" fill="url(#bgGeo)"/>

  <!-- Formes géométriques décoratives à droite -->
  <polygon points="720,0 900,0 900,220 610,220" fill="#14182e" opacity="0.65"/>
  <polygon points="760,0 900,0 900,150 680,150" fill="#ec4899" opacity="0.08"/>
  <circle cx="775" cy="110" r="56" stroke="url(#accentGeo)" stroke-width="2" opacity="0.45"/>
  <circle cx="775" cy="110" r="34" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.6"/>
  <line x1="640" y1="185" x2="860" y2="35" stroke="url(#accentGeo)" stroke-width="1.5" opacity="0.35"/>

  <!-- Bordure -->
  <rect x="1" y="1" width="898" height="218" rx="11" stroke="url(#accentGeo)" stroke-width="1.5" opacity="0.75"/>

  <!-- Identité -->
  <text x="48" y="82" font-family="'Segoe UI', Inter, Ubuntu, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5" fill="url(#textGeo)">Léo Baskarane</text>
  <text x="48" y="114" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="700" fill="#22d3ee">Développeur Full-Stack &amp; Créateur Web</text>
  <text x="48" y="138" font-family="'Segoe UI', Inter, Ubuntu, sans-serif" font-size="13" fill="#94a3b8">Applications web, APIs REST et solutions sur mesure.</text>

  <!-- Pills stack -->
  <rect x="48" y="160" width="76" height="26" rx="6" fill="#18182b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="86" y="177" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#d8b4fe">Python</text>

  <rect x="132" y="160" width="82" height="26" rx="6" fill="#241428" stroke="#ec4899" stroke-width="1.2"/>
  <text x="173" y="177" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#f9a8d4">FastAPI</text>

  <rect x="222" y="160" width="104" height="26" rx="6" fill="#0f2332" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="274" y="177" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#67e8f9">HTML/CSS/JS</text>

  <rect x="334" y="160" width="72" height="26" rx="6" fill="#13222e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="370" y="177" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#7dd3fc">MySQL</text>
</svg>
